[platformio]
default_envs = tasmota32s3-lvgl

[env:tasmota32s3-lvgl]
extends = env:tasmota32-lvgl
board = esp32s3-qio_opi
board_build.partitions = partitions/esp32_partition_app3904k_fs11584k.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
build_flags = ${env:tasmota32-lvgl.build_flags}
              -DSHOW_SPLASH
              -DUSE_I2S_AUDIO
              -DUSE_I2S_MIC
              -DUSE_BERRY_WEBCLIENT_TIMEOUT=10000
              -DUSE_TASMOCLAW_HTTPS
              -Ilib/libesp32/tasmoclaw_mbedtls_ssl/include
              -DMBEDTLS_USER_CONFIG_FILE=\"tasmoclaw_mbedtls_user_config.h\"
              -DESP32S3_RLCD_4_2
lib_extra_dirs = ${env:tasmota32-lvgl.lib_extra_dirs}
                 lib/lib_audio
                 lib/lib_deprecated
lib_deps = ${env:tasmota32-lvgl.lib_deps}
           TasmoClaw mbedTLS SSL shim
custom_sdkconfig = CONFIG_SPIRAM=y
                   CONFIG_SPIRAM_MODE_OCT=y
                   CONFIG_SPIRAM_SPEED_80M=y
                   CONFIG_SPIRAM_MALLOC_ALWAYSINTERNAL=512
                   CONFIG_SPIRAM_MALLOC_RESERVE_INTERNAL=65536
                   '# CONFIG_SPIRAM_MEMTEST is not set'
